<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | WaterControl Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <div class="logo" style="text-align: center; margin-bottom: 2rem;">
                Water<span>Control</span> Pro
            </div>
            
            <h2>Bem-vindo de volta</h2>
            <p>Acesse seu painel de monitoramento</p>

            <p id="error-message" style="color: #ff4d4d; text-align: center; font-size: 0.9rem; margin-bottom: 1rem; display: none;"></p>

            <form id="login-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Entrar no Sistema</button>
            </form>
            <div class="auth-links">
                <a href="recuperar.html">Esqueci minha senha</a>
                <a href="cadastro.html">Não tem uma conta? Cadastre-se</a>
</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script src="script.js"></script>
</body>
</html>
