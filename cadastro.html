<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro | WaterControl Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box" style="max-width: 500px;"> <h2>Criar Conta</h2>
            <p>Comece a monitorar seu reservatório</p>
            <p id="error-message" style="color: #ff4d4d; text-align: center; display: none;"></p>

            <form id="cadastro-form">
                <div class="radio-group" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; justify-content: center;">
                    <label style="cursor: pointer;">
                        <input type="radio" name="tipoConta" value="residencial" checked> Residencial
                    </label>
                    <label style="cursor: pointer;">
                        <input type="radio" name="tipoConta" value="empresarial"> Empresarial
                    </label>
                </div>

                <div class="input-group">
                    <label>Nome Completo / Nome da Empresa</label>
                    <input type="text" id="nome" placeholder="Nome ou Razão Social" required>
                </div>
                
                <div class="input-group" id="cnpj-group" style="display: none;">
                    <label>CNPJ</label>
                    <input type="text" id="cnpj" placeholder="00.000.000/0000-00">
                </div>

                <div class="input-group">
                    <label>Telefone / WhatsApp</label>
                    <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
                </div>

                <div class="input-group">
                    <label>Endereço Completo (Rua, Nº, Bairro, Cidade)</label>
                    <input type="text" id="endereco" placeholder="Rua das Águas, 123" required>
                </div>

                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <div style="position: relative;">
                        <input type="password" id="password" required style="width: 100%; padding-right: 40px; box-sizing: border-box;">
                        <i class="fas fa-eye" id="togglePassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8;"></i>
                    </div>
                    
                    <ul id="password-requirements" style="list-style: none; padding: 0; margin-top: 10px; font-size: 0.85rem; color: #ff4d4d; text-align: left;">
                        <li id="req-length"><i class="fas fa-times"></i> Mínimo de 8 caracteres</li>
                        <li id="req-upper"><i class="fas fa-times"></i> Pelo menos 1 letra maiúscula</li>
                        <li id="req-symbol"><i class="fas fa-times"></i> Pelo menos 1 símbolo (!@#$&*)</li>
                        <li id="req-number"><i class="fas fa-times"></i> Pelo menos 1 número</li>
                    </ul>
                </div>

                <button type="submit" class="btn-primary">Finalizar Cadastro</button>
            </form>
            <div class="auth-links">
                <a href="login.html">Já tem uma conta? Faça Login</a>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
