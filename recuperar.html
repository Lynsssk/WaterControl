<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha | WaterControl Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Recuperar Senha</h2>
            <p>Enviaremos um link para redefinir sua senha.</p>
            <p id="status-message" style="text-align: center; display: none; margin-bottom: 1rem;"></p>

            <form id="recuperar-form">
                <div class="input-group">
                    <label>Seu E-mail Cadastrado</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                <button type="submit" class="btn-primary">Enviar Link</button>
            </form>
            <div class="auth-links">
                <a href="login.html">Voltar para o Login</a>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
